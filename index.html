<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otra Cosa 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--card:#fdf6e3;--tx:#2b0a4f;--mu:#6a5a86;--ac:#f0148c;--acx:#ffffff;--bd:#3b0a6b;--sh:#00c9b7;--hd:#7b0fa3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a0a2e;--card:#2a1347;--tx:#fdf6e3;--mu:#c4b5dc;--ac:#ff3fa4;--acx:#1a0a2e;--bd:#7b0fa3;--sh:#00c9b7;--hd:#00c9b7}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a0a2e;--card:#2a1347;--tx:#fdf6e3;--mu:#c4b5dc;--ac:#ff3fa4;--acx:#1a0a2e;--bd:#7b0fa3;--sh:#00c9b7;--hd:#00c9b7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 20px 4px;max-width:960px;margin:auto;text-align:center}
.logo{display:block;margin:0 auto;width:min(380px,86%);height:auto;border-radius:16px;background:#fff}
header p{margin:12px 0 0;color:var(--mu);font-weight:600}
main{max-width:960px;margin:auto;padding:16px 20px 150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:2.5px solid var(--bd);box-shadow:5px 5px 0 var(--sh);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.ico{font-size:2.4rem}
.card h3{margin:0;font-size:1.05rem;font-weight:800;color:var(--hd)}
.card .d{color:var(--mu);font-size:.9rem;flex:1}
.pr{font-weight:800;font-size:1.15rem}
.st{font-size:.8rem;color:var(--mu);font-weight:600}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);border-radius:12px;padding:9px 14px;background:var(--ac);color:var(--acx);font-weight:800}
button:disabled{opacity:.4;cursor:not-allowed}
button.g{background:transparent;color:var(--tx);border:2px solid var(--bd);padding:2px 10px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--sh);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
#bar>div{max-width:960px;margin:auto}
#items{max-height:34vh;overflow:auto;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:.92rem}
.q{display:flex;align-items:center;gap:6px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px}
input{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:8px}
#empty{color:var(--mu);font-size:.9rem}
.card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;border-radius:10px;border:2px solid var(--bd)}
h2{margin:22px 0 4px;font-size:1.25rem;font-weight:800;color:var(--hd)}
.sub{margin:0 0 12px;color:var(--mu);font-size:.92rem}
select{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:600}
</style>
</head>

const fmt = n => "$" + Number(n).toLocaleString("es-CL");
const cart = {};
const $ = id => document.getElementById(id);
const wa = m => window.open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(m), "_blank");
const maxQ = p => (p.stock === null || p.stock === undefined) ? 10 : p.stock;

function card(p) {
  const c = document.createElement("div"); c.className = "card";
  if (p.img && IMG[p.img]) { const im = document.createElement("img"); im.src = IMG[p.img]; im.alt = p.nombre; c.appendChild(im); }
  else { const ico = document.createElement("div"); ico.className = "ico"; ico.textContent = p.icono || "🧩"; c.appendChild(ico); }
  const h = document.createElement("h3"); h.textContent = p.nombre;
  const d = document.createElement("div"); d.className = "d"; d.textContent = p.desc || "";
  const pr = document.createElement("div"); pr.className = "pr"; pr.textContent = p.tipo === "cotiza" ? fmt(TAMANOS[0].precio) : fmt(p.precio);
  const st = document.createElement("div"); st.className = "st";
  const sin = p.tipo === "venta" && p.stock !== null && p.stock <= 0;
  st.textContent = p.tipo !== "venta" ? "Hecho a pedido" : sin ? "Agotado" : p.stock === null ? "Hecho a pedido" : (p.stock <= 3 ? "Quedan " + p.stock : "Disponible");
  const b = document.createElement("button"); b.disabled = sin;
  let sel = null, nota = null;
  if (p.tipo === "cotiza" && p.soloCotiza) {
    nota = document.createElement("div"); nota.className = "st"; nota.textContent = "📷 Debes enviarnos 2 fotos de la persona por WhatsApp.";
    b.textContent = "Cotiza por WhatsApp";
    b.onclick = () => wa("Hola, quiero cotizar: " + p.nombre.toLowerCase() + ". Te envío 2 fotos de la persona.");
  } else if (p.tipo === "cotiza") {
    sel = document.createElement("select");
    TAMANOS.forEach((t, i) => { const o = document.createElement("option"); o.value = i; o.textContent = t.cm + " cm · " + fmt(t.precio); sel.appendChild(o); });
    sel.onchange = () => { pr.textContent = fmt(TAMANOS[sel.value].precio); };
    nota = document.createElement("div"); nota.className = "st"; nota.textContent = "📷 Debes enviarnos 2 fotos de la persona por WhatsApp.";
    b.textContent = "Pedir por WhatsApp";
    b.onclick = () => { const t = TAMANOS[sel.value]; wa("Hola, quiero pedir una figura 3D personalizada (" + p.nombre.toLowerCase() + ") de " + t.cm + " cm por " + fmt(t.precio) + ". Te envío 2 fotos de la persona."); };
  } else if (p.tipo === "llavero") {
    nota = document.createElement("div"); nota.className = "st"; nota.textContent = "📷 Debes enviarnos 2 fotos de la mascota por WhatsApp.";
    b.textContent = "Pedir por WhatsApp";
    b.onclick = () => wa("Hola, quiero pedir un llavero de mi mascota de " + p.cm + " cm por " + fmt(p.precio) + ". Te envío 2 fotos de la mascota.");
  } else if (p.tipo === "directo") {
    b.textContent = "Pedir por WhatsApp";
    b.onclick = () => wa("Hola, quiero pedir: " + p.nombre + " (" + p.cm + " cm) por " + fmt(p.precio) + ".");
  } else { b.textContent = "Agregar"; b.onclick = () => add(p.id, 1); }
  c.append(h, d); if (!p.soloCotiza) c.append(pr); c.append(st);
  if (sel) c.append(sel, nota); else if (nota) c.append(nota);
  c.append(b);
  return c;
}

function renderGrid() {
  $("g1").innerHTML = ""; $("g2").innerHTML = ""; $("g3").innerHTML = ""; $("g4").innerHTML = "";
  PRODUCTS.forEach(p => (p.tipo === "cotiza" ? $("g2") : p.tipo === "llavero" ? $("g3") : p.tipo === "directo" ? $("g4") : $("g1")).appendChild(card(p)));
}

function add(id, n) {
  const p = PRODUCTS.find(x => x.id === id);
  const q = Math.max(0, Math.min(maxQ(p), (cart[id] || 0) + n));
  if (q === 0) delete cart[id]; else cart[id] = q;
  renderCart();
}

function renderCart() {
  const box = $("items"); box.innerHTML = "";
  let total = 0, count = 0;
  Object.keys(cart).forEach(id => {
    const p = PRODUCTS.find(x => x.id === id), q = cart[id];
    total += p.precio * q; count += q;
    const r = document.createElement("div"); r.className = "row";
    const t = document.createElement("span"); t.textContent = p.nombre;
    const qb = document.createElement("span"); qb.className = "q";
    const m = document.createElement("button"); m.className = "g"; m.textContent = "−"; m.onclick = () => add(id, -1);
    const n = document.createElement("span"); n.textContent = q;
    const pl = document.createElement("button"); pl.className = "g"; pl.textContent = "+"; pl.onclick = () => add(id, 1);
    qb.append(m, n, pl); r.append(t, qb); box.appendChild(r);
  });
  if (!count) { const e = document.createElement("div"); e.id = "empty"; e.textContent = "Tu pedido está vacío."; box.appendChild(e); }
  $("tot").textContent = "Total: " + fmt(total);
  $("send").disabled = !count;
}

$("send").onclick = () => {
  const nom = $("nom").value.trim();
  let total = 0, pedido = false;
  const lineas = Object.keys(cart).map(id => {
    const p = PRODUCTS.find(x => x.id === id), q = cart[id];
    total += p.precio * q; if (p.stock === null) pedido = true;
    return "• " + q + " x " + p.nombre + " (" + fmt(p.precio * q) + ")";
  });
  wa("Hola, quiero hacer un pedido" + (nom ? " a nombre de " + nom : "") + ":\n" + lineas.join("\n") + "\nTotal: " + fmt(total) + (pedido ? "\nTe envío las fotos para armar la figura." : ""));
};

renderGrid(); renderCart();
</script>
