<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administración · Otra Cosa 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--card:#fdf6e3;--tx:#2b0a4f;--mu:#6a5a86;--ac:#f0148c;--acx:#ffffff;--bd:#3b0a6b;--sh:#00c9b7;--hd:#7b0fa3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a0a2e;--card:#2a1347;--tx:#fdf6e3;--mu:#c4b5dc;--ac:#ff3fa4;--acx:#1a0a2e;--bd:#7b0fa3;--sh:#00c9b7;--hd:#00c9b7}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a0a2e;--card:#2a1347;--tx:#fdf6e3;--mu:#c4b5dc;--ac:#ff3fa4;--acx:#1a0a2e;--bd:#7b0fa3;--sh:#00c9b7;--hd:#00c9b7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 20px 4px;max-width:960px;margin:auto;text-align:center}
.logo{display:block;margin:0 auto;width:min(380px,86%);height:auto;border-radius:16px;background:#fff}
header p{margin:12px 0 0;color:var(--mu);font-weight:600}
main{max-width:960px;margin:auto;padding:16px 20px 150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:2.5px solid var(--bd);box-shadow:5px 5px 0 var(--sh);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.ico{font-size:2.4rem}
.card h3{margin:0;font-size:1.05rem;font-weight:800;color:var(--hd)}
.card .d{color:var(--mu);font-size:.9rem;flex:1}
.pr{font-weight:800;font-size:1.15rem}
.st{font-size:.8rem;color:var(--mu);font-weight:600}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);border-radius:12px;padding:9px 14px;background:var(--ac);color:var(--acx);font-weight:800}
button:disabled{opacity:.4;cursor:not-allowed}
button.g{background:transparent;color:var(--tx);border:2px solid var(--bd);padding:2px 10px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--sh);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
#bar>div{max-width:960px;margin:auto}
#items{max-height:34vh;overflow:auto;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:.92rem}
.q{display:flex;align-items:center;gap:6px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px}
input{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:8px}
#empty{color:var(--mu);font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:10px}
.step{background:var(--card);border:2.5px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.step b{display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin:0 auto 8px;border-radius:50%;background:var(--ac);color:var(--acx);font-size:1.2rem}
.step:nth-child(even) b{background:var(--sh);color:#1a0a2e}
.step:nth-child(3) b{background:#7b0fa3;color:#fff}
.step h3{margin:0 0 4px;font-size:1rem;font-weight:800;color:var(--hd)}
.step p{margin:0;font-size:.88rem;color:var(--mu)}
[hidden]{display:none!important}
#menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px}
#q{margin-bottom:8px}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;background:transparent;color:var(--tx);border:2px solid var(--bd);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.chip.on{background:var(--ac);color:var(--acx)}
#nores{color:var(--mu);text-align:center;padding:28px 0}
.trk{display:flex;gap:8px}.trk input{margin:0;flex:1}
.two{display:flex;gap:8px}.two input{margin-bottom:8px}
#seg-top{max-width:960px;margin:8px auto 0;padding:0 20px}
.segbox{background:var(--card);border:2.5px solid var(--bd);box-shadow:5px 5px 0 var(--sh);border-radius:16px;padding:12px 14px}
.segbox>strong{display:block;margin-bottom:8px;color:var(--hd);font-weight:800}
#trkr{margin-top:10px;color:var(--mu);font-weight:600}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ps{padding:10px;border:2px solid var(--bd);border-radius:12px;text-align:center;font-weight:700;font-size:.88rem;color:var(--mu)}
.ps.on{background:var(--sh);color:#1a0a2e;border-color:var(--sh)}
.ps.cur{background:var(--ac);color:var(--acx);border-color:var(--bd)}
#seg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;max-width:420px;margin:auto;z-index:30;background:var(--card);border:2.5px solid var(--bd);box-shadow:5px 5px 0 var(--sh);border-radius:16px;padding:12px 14px;font-weight:600}
#seg strong{display:block;font-size:1.25rem;color:var(--hd);letter-spacing:.5px}
.card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;border-radius:10px;border:2px solid var(--bd)}
h2{margin:22px 0 4px;font-size:1.25rem;font-weight:800;color:var(--hd)}
.sub{margin:0 0 12px;color:var(--mu);font-size:.92rem}
select{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:600}
#cartbtn{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;z-index:20;padding:13px 16px;font-size:1rem;box-shadow:5px 5px 0 var(--sh)}
#cartview{position:fixed;inset:0;z-index:40;background:rgba(20,5,40,.55);display:flex;align-items:flex-end;justify-content:center}
.cvbox{background:var(--card);border:3px solid var(--bd);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.cvtop{display:flex;justify-content:space-between;align-items:center}.cvtop h2{margin:0}
#cartview #items{max-height:none;margin:10px 0}
.cvh{margin:14px 0 8px;color:var(--hd)}
#cerr{color:#d6336c;font-weight:700;margin:0 0 8px;font-size:.9rem}
#send{width:100%;padding:13px;margin-bottom:8px}
#seguir{width:100%;padding:10px}
#trkmodal{position:fixed;inset:0;z-index:50;background:rgba(20,5,40,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--card);border:3px solid var(--bd);box-shadow:6px 6px 0 var(--sh);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.mbox h2{margin:0 0 4px}
#mtxt{font-size:1.15rem;font-weight:800;color:var(--hd);margin:10px 0}
#mprog .prog{grid-template-columns:repeat(2,1fr)}
#mdias{margin:12px 0;font-weight:600}
#mx{width:100%;padding:12px}
.atop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.atop h2{margin:0}
.abtns{display:flex;gap:8px;flex-wrap:wrap}.abtns button{padding:6px 12px}
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.alogin{max-width:360px;margin:30px auto}.alogin button{width:100%;margin-bottom:8px;padding:12px}
.aerr{color:#d6336c;font-weight:700;margin:0 0 8px;font-size:.9rem;min-height:1.2em}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.adet{white-space:pre-wrap;font-size:.84rem;color:var(--mu);max-height:7.5em;overflow:auto;border:1.5px dashed var(--bd);border-radius:10px;padding:6px 8px}
.arow{display:flex;gap:8px;align-items:center}.arow>*{flex:1;margin-bottom:0}.arow button{flex:none}
.alink{display:block;text-align:center;text-decoration:none;font-weight:800;border:2px solid var(--bd);border-radius:12px;padding:8px 12px;background:var(--sh);color:#1a0a2e}
.danger{background:transparent;color:#d6336c;border:2px solid #d6336c}
.atiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.atile,.abox{background:var(--card);border:2.5px solid var(--bd);box-shadow:4px 4px 0 var(--sh);border-radius:16px;padding:12px 14px}
.aval{font-size:1.35rem;font-weight:800;color:var(--hd)}
.abox{margin-bottom:14px}.abox h3{margin:0 0 6px;color:var(--hd)}
.afm{max-width:520px}.afm label{display:block;font-weight:700;font-size:.85rem;margin:2px 0 4px;color:var(--mu)}
textarea{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:8px;resize:vertical;text-align:left}
.cfm{position:fixed;inset:0;z-index:50;background:rgba(20,5,40,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.cfm .mbox{text-align:left}.cfmd{font-weight:800;color:var(--hd);margin:10px 0}.bigb{width:100%;padding:11px;margin-top:8px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;z-index:70;background:var(--card);border:2.5px solid var(--bd);box-shadow:4px 4px 0 var(--sh);border-radius:14px;padding:10px 14px;font-weight:700;text-align:center}
main{padding-bottom:60px}
</style>
</head>

  <p>Administración de pedidos</p>
</header>
<main><div id="admc"></div></main>
<div id="toast" hidden></div>
<script>
const CONFIG = { ventasUrl: "https://script.google.com/macros/s/AKfycbyUwBkkuveouRZRdFCRPJBlwJCce_tuw6NB1odwwG5iArVLhQ0EVzjEiXTKiS7CaCJl/exec" };
const ESTADOS = ["Agendado", "En preparación", "Listo para entrega", "Entregado"];
const ENTREGAS = ["En persona", "Envío"];
const $ = id => document.getElementById(id);
const fmt = n => "$" + Number(n).toLocaleString("es-CL");
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const ADM = { token: null, pedidos: [], tab: "pedidos", est: "todos", entrega: "todos", q: "" };
try { ADM.token = sessionStorage.getItem("oc_adm") || null; } catch (e) {}
const el = (t, p, ...k) => { const e = document.createElement(t); if (p) Object.assign(e, p); k.flat().forEach(x => { if (x != null && x !== false) e.append(x); }); return e; };
const txt = (t, c) => el("div", { className: c || "", textContent: t });
const admSet = v => { const r = $("admc"); r.innerHTML = ""; [].concat(v).forEach(x => r.append(x)); };
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3500); }

async function admApi(body) {
  try {
    const r = await fetch(CONFIG.ventasUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ token: ADM.token }, body)) });
    return await r.json();
  } catch (e) { return { ok: false, error: "red" }; }
}
/* Antes de entrar se comprueba (con un GET inofensivo) que el script de pedidos esté actualizado. */
const admVer = () => fetch(CONFIG.ventasUrl + "?v=admin").then(r => r.json()).then(j => !!(j && j.admin === true)).catch(() => false);
async function admCall(body, m) {
  const say = t => { if (m) m.textContent = t; else if (t) toast(t); };
  if (m) m.textContent = "Guardando…";
  const j = await admApi(body);
  if (j && j.ok) { if (m) m.textContent = ""; return j; }
  if (j && j.error === "auth") { admSalir("Tu sesión expiró. Ingresa de nuevo."); return null; }
  say("⚠ " + ({ red: "No pudimos conectar. Intenta de nuevo.", no_encontrado: "No encontramos ese pedido.", datos: "Revisa los datos ingresados." }[j && j.error] || "No se pudo guardar."));
  return null;
}
function iniciar() {
  admSet(txt("Conectando…", "st"));
  admVer().then(ok => {
    if (!ok) return admSet([el("h2", { textContent: "No pudimos conectar" }), txt("El script de pedidos no responde o todavía no está actualizado para el panel. Revisa que lo hayas implementado con la versión nueva.", "sub"), el("button", { textContent: "Reintentar", onclick: iniciar })]);
    ADM.token ? admCargar() : vLogin();
  });
}
function admSalir(msg) {
  ADM.token = null; try { sessionStorage.removeItem("oc_adm"); } catch (e) {}
  vLogin(typeof msg === "string" ? msg : "");
}
function vLogin(msg) {
  const u = el("input", { placeholder: "Usuario", autocomplete: "username" });
  const p = el("input", { type: "password", placeholder: "Clave", autocomplete: "current-password" });
  const er = txt(msg || "", "aerr");
  const go = el("button", { type: "submit", textContent: "Entrar" });
  const f = el("form", { className: "alogin" }, el("h2", { textContent: "Ingresar" }), txt("Usuario y clave de administrador.", "sub"), u, p, er, go);
  f.onsubmit = async ev => {
    ev.preventDefault(); go.disabled = true; er.textContent = "Entrando…";
    const j = await admApi({ action: "login", usuario: u.value.trim(), clave: p.value });
    go.disabled = false;
    if (j && j.ok) { ADM.token = j.token; try { sessionStorage.setItem("oc_adm", j.token); } catch (e) {} admCargar(); return; }
    er.textContent = { credenciales: "Usuario o clave incorrectos.", config: "Falta definir la clave en el script.", red: "No pudimos conectar. Intenta de nuevo." }[j && j.error] || "No se pudo entrar.";
  };
  admSet(f); u.focus();
}
async function admCargar() {
  admSet(txt("Cargando pedidos…", "st"));
  const j = await admApi({ action: "list" });
  if (j && j.ok) { ADM.pedidos = j.pedidos; return vPanel(); }
  if (j && j.error === "auth") return admSalir("Tu sesión expiró. Ingresa de nuevo.");
  admSet([txt("No pudimos cargar los pedidos.", "aerr"), el("button", { textContent: "Reintentar", onclick: admCargar })]);
}
function vPanel() {
  const top = el("div", { className: "atop" }, el("h2", { textContent: "Panel de administrador" }),
    el("div", { className: "abtns" },
      el("button", { className: "g", textContent: "Actualizar", onclick: () => admCargar() }),
      el("button", { className: "g", textContent: "Ver tienda", onclick: () => { location.href = "index.html"; } }),
      el("button", { className: "g", textContent: "Salir", onclick: () => admSalir() })));
  const tabs = el("div", { className: "atabs" }, [["pedidos", "Pedidos (" + ADM.pedidos.length + ")"], ["nuevo", "Nuevo pedido"], ["ventas", "Ventas"]]
    .map(([k, t]) => el("button", { className: "chip" + (ADM.tab === k ? " on" : ""), textContent: t, onclick: () => { ADM.tab = k; vPanel(); } })));
  ADM.lblPed = tabs.firstChild;
  admSet([top, tabs, ADM.tab === "pedidos" ? tPedidos() : ADM.tab === "nuevo" ? tNuevo() : tVentas()]);
}
const waLink = p => p.telefono ? "https://wa.me/" + p.telefono + "?text=" + encodeURIComponent("Hola " + p.cliente + ", tu pedido " + p.id + " está: " + p.estado + ".") : "";
function optionsDe(lista, actual) {
  const arr = lista.slice(); if (actual && !arr.includes(actual)) arr.push(actual);
  return arr.map(v => el("option", { value: v, textContent: v }));
}
function confirmar(titulo, dato, nota, boton) {
  return new Promise(res => {
    const cerrar = v => { ov.remove(); res(v); };
    const ov = el("div", { className: "cfm", onclick: e => { if (e.target === ov) cerrar(false); } },
      el("div", { className: "mbox" }, el("h2", { textContent: titulo }), txt(dato, "cfmd"), txt(nota, "st"),
        el("button", { className: "danger bigb", textContent: boton, onclick: () => cerrar(true) }),
        el("button", { className: "g bigb", textContent: "Cancelar", onclick: () => cerrar(false) })));
    document.body.append(ov);
  });
}
async function eliminar(p) {
  const si = await confirmar("¿Eliminar este pedido?", p.id + " · " + (p.cliente || "sin nombre") + (p.total != null ? " · " + fmt(p.total) : ""),
    "Se guardará una copia en la pestaña “Eliminados” de tu planilla, por si lo necesitas después.", "Sí, eliminar");
  if (!si) return;
  const j = await admCall({ action: "delete", id: p.id });
  if (j) { ADM.pedidos = ADM.pedidos.filter(x => x.id !== p.id); vPanel(); toast("Pedido eliminado"); }
}
function tPedidos() {
  const q = el("input", { type: "search", placeholder: "Buscar por cliente, teléfono, N° o detalle…", value: ADM.q });
  const se = el("select", null, el("option", { value: "todos", textContent: "Todos los estados" }), optionsDe(ESTADOS)); se.value = ADM.est;
  const sm = el("select", null, el("option", { value: "todos", textContent: "Toda forma de entrega" }), optionsDe(ENTREGAS)); sm.value = ADM.entrega;
  const lista = el("div", { className: "agrid" });
  const pintar = () => {
    ADM.q = q.value; ADM.est = se.value; ADM.entrega = sm.value; lista.innerHTML = "";
    const nq = norm(q.value.trim());
    const ps = ADM.pedidos.filter(p => (se.value === "todos" || p.estado === se.value) && (sm.value === "todos" || p.entrega === sm.value) &&
      (!nq || norm([p.id, p.cliente, p.telefono, p.detalle].join(" ")).includes(nq)));
    if (!ps.length) lista.append(txt("No hay pedidos con ese filtro.", "st"));
    ps.forEach(p => lista.append(cPedido(p)));
  };
  q.oninput = pintar; se.onchange = pintar; sm.onchange = pintar; pintar();
  return el("div", null, el("div", { className: "two" }, q, se, sm), lista);
}
function cPedido(p) {
  const msg = txt("", "st");
  const se = el("select", null, optionsDe(ESTADOS, p.estado)); se.value = p.estado;
  const aviso = el("a", { className: "alink", target: "_blank", rel: "noopener", textContent: "Avisar por WhatsApp", href: waLink(p) || "#" });
  aviso.addEventListener("click", e => { if (!p.telefono) { e.preventDefault(); toast("Primero falta agregar el número del cliente (Editar datos)"); } });
  se.onchange = async () => {
    const j = await admCall({ action: "update", id: p.id, estado: se.value }, msg);
    if (j) { p.estado = se.value; aviso.href = waLink(p) || "#"; msg.textContent = "✔ Estado actualizado"; } else se.value = p.estado;
  };
  const tot = el("input", { type: "number", min: "0", step: "1", placeholder: "Total $", value: p.total == null ? "" : p.total });
  const gt = el("button", { className: "g", textContent: "Guardar total", onclick: async () => {
    const j = await admCall({ action: "update", id: p.id, total: tot.value === "" ? "" : Number(tot.value) }, msg);
    if (j) { p.total = tot.value === "" ? null : Number(tot.value); msg.textContent = "✔ Total guardado"; }
  } });
  const nom = el("input", { placeholder: "Cliente", value: p.cliente });
  const tel = el("input", { type: "tel", placeholder: "Teléfono", value: p.telefono });
  const det = el("textarea", { rows: 4, maxLength: 2000, value: p.detalle });
  const med = el("select", null, optionsDe(ENTREGAS, p.entrega)); med.value = p.entrega || "En persona";
  const emsg = txt("", "st");
  const ent = el("select", null, el("option", { value: "", textContent: "Forma de entrega: sin definir" }), optionsDe(ENTREGAS)); ent.value = p.entrega || "";
  ent.onchange = async () => {
    const j = await admCall({ action: "update", id: p.id, entrega: ent.value }, msg);
    if (j) { p.entrega = ent.value; msg.textContent = "✔ Forma de entrega actualizada"; } else ent.value = p.entrega || "";
  };
  const form = el("div", { hidden: true }, txt("Cliente", "st"), nom, txt("Teléfono", "st"), tel, txt("Detalle", "st"), det, txt("Forma de entrega", "st"), med,
    el("button", { textContent: "Guardar cambios", onclick: async () => {
      const j = await admCall({ action: "update", id: p.id, cliente: nom.value.trim(), telefono: tel.value, detalle: det.value, entrega: med.value }, emsg);
      if (j) admCargar();
    } }), emsg);
  const ed = el("button", { className: "g", textContent: "Editar datos", onclick: () => { form.hidden = !form.hidden; } });
  const del = el("button", { className: "danger", textContent: "Eliminar", onclick: () => eliminar(p) });
  return el("div", { className: "card" },
    el("div", { className: "arow" }, el("strong", { textContent: p.id }), txt(p.fecha, "st")),
    txt((p.cliente || "(sin nombre)") + (p.telefono ? " · +" + p.telefono : "") + (p.entrega ? " · " + p.entrega : ""), "d"),
    txt(p.detalle, "adet"), se, ent, el("div", { className: "arow" }, tot, gt), aviso, el("div", { className: "arow" }, ed, del), form, msg);
}
function tNuevo() {
  const nom = el("input", { placeholder: "Nombre del cliente", autocomplete: "off" });
  const tel = el("input", { type: "tel", placeholder: "WhatsApp (opcional)", autocomplete: "off" });
  const det = el("textarea", { rows: 4, maxLength: 2000, placeholder: "Qué pidió (ej: Figura de pareja 15 cm, llavero de mascota…)" });
  const tot = el("input", { type: "number", min: "0", step: "1", placeholder: "Total $ (opcional)" });
  const med = el("select", null, optionsDe(ENTREGAS)); med.value = "En persona";
  const est = el("select", null, optionsDe(ESTADOS));
  const msg = txt("", "st");
  const go = el("button", { textContent: "Guardar pedido", onclick: async () => {
    if (!nom.value.trim() || !det.value.trim()) { msg.textContent = "⚠ Escribe el nombre y qué pidió."; return; }
    go.disabled = true;
    const j = await admCall({ action: "create", cliente: nom.value.trim(), telefono: tel.value, detalle: det.value.trim(), total: tot.value === "" ? "" : Number(tot.value), entrega: med.value, estado: est.value }, msg);
    go.disabled = false;
    if (!j) return;
    ADM.pedidos.unshift(j.pedido);
    if (ADM.lblPed) ADM.lblPed.textContent = "Pedidos (" + ADM.pedidos.length + ")";
    msg.textContent = "✔ Pedido registrado: " + j.pedido.id;
    [nom, tel, det, tot].forEach(i => { i.value = ""; });
  } });
  return el("div", { className: "afm" }, txt("Para pedidos que llegan en persona o por otro canal.", "sub"),
    el("label", { textContent: "Cliente" }), nom, el("label", { textContent: "WhatsApp" }), tel, el("label", { textContent: "Detalle" }), det,
    el("label", { textContent: "Total" }), tot, el("label", { textContent: "Forma de entrega" }), med, el("label", { textContent: "Estado" }), est, go, msg);
}
function tVentas() {
  const ps = ADM.pedidos, conT = ps.filter(p => p.total != null), suma = a => a.reduce((s, p) => s + p.total, 0);
  const total = suma(conT), entr = conT.filter(p => p.estado === "Entregado"), ent = suma(entr);
  const tile = (t, v, s) => el("div", { className: "atile" }, txt(t, "st"), txt(v, "aval"), txt(s || "", "st"));
  const tiles = el("div", { className: "atiles" },
    tile("Total vendido", fmt(total), conT.length + (conT.length === 1 ? " pedido" : " pedidos")),
    tile("Entregado", fmt(ent), entr.length + (entr.length === 1 ? " pedido" : " pedidos")),
    tile("Por entregar", fmt(total - ent), (conT.length - entr.length) + " en curso"),
    tile("Ticket promedio", conT.length ? fmt(Math.round(total / conT.length)) : "—", "por pedido"),
    tile("Pedidos", String(ps.length), (ps.length - conT.length) + " sin total"));
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const mesTxt = k => /^\d{4}-\d{2}$/.test(k) ? MESES[Number(k.slice(5)) - 1] + " " + k.slice(0, 4) : "Sin fecha";
  const grupo = (titulo, clave, orden, etiqueta) => {
    const m = {}; conT.forEach(p => { const k = clave(p) || "—"; m[k] = m[k] || { n: 0, s: 0 }; m[k].n++; m[k].s += p.total; });
    const ks = orden(Object.keys(m));
    return el("div", { className: "abox" }, el("h3", { textContent: titulo }), ks.length ? ks.map(k => el("div", { className: "row" },
      el("span", { textContent: etiqueta(k) + " · " + m[k].n + (m[k].n === 1 ? " pedido" : " pedidos") }), el("strong", { textContent: fmt(m[k].s) }))) : txt("Sin datos todavía.", "st"));
  };
  const idem = k => k;
  return el("div", null, tiles,
    grupo("Ventas por mes", p => p.mes, ks => ks.sort().reverse(), mesTxt),
    grupo("Por estado", p => p.estado, ks => ESTADOS.filter(e => ks.includes(e)).concat(ks.filter(k => !ESTADOS.includes(k))), idem),
    grupo("Por forma de entrega", p => p.entrega || "Sin definir", ks => ENTREGAS.filter(e => ks.includes(e)).concat(ks.filter(k => !ENTREGAS.includes(k))), idem),
    ps.length > conT.length ? txt("Los pedidos sin total (por ejemplo, cotizaciones) no suman en las ventas: ábrelos en Pedidos y escribe su total.", "st") : null);
}
iniciar();
</script>
